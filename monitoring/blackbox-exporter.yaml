apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-config
  namespace: microservices-dev
data:
  blackbox.yml: |
    modules:
      http_200:
        prober: http
        timeout: 5s
        http:
          valid_status_codes: [200]
          method: GET
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: microservices-dev
  labels:
    app: blackbox-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
    spec:
      containers:
      - name: blackbox-exporter
        image: prom/blackbox-exporter:latest
        ports:
        - containerPort: 9115
        args:
        - "--config.file=/etc/blackbox_exporter/blackbox.yml"
        volumeMounts:
        - name: config-volume
          mountPath: /etc/blackbox_exporter
      volumes:
      - name: config-volume
        configMap:
          name: blackbox-config
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: microservices-dev
spec:
  type: ClusterIP
  selector:
    app: blackbox-exporter
  ports:
    - port: 9115
      targetPort: 9115
